name: Canary Check

on:
  schedule:
    # JST 06:00 / 18:00
    - cron: "0 21,9 * * *"
  workflow_dispatch:
    inputs:
      radiko_station_id:
        description: "radiko station id (e.g. TBS)"
        required: false
        default: "TBS"
      radiru_area_id:
        description: "Radiru area id (e.g. JP13)"
        required: false
        default: "JP13"
      radiru_station_id:
        description: "Radiru station id (e.g. r1)"
        required: false
        default: "r1"
      realtime_record_seconds:
        description: "Realtime record seconds"
        required: false
        default: "30"
      timefree_record_seconds:
        description: "Timefree record seconds"
        required: false
        default: "30"
      radiru_ondemand_record_seconds:
        description: "Radiru on-demand record seconds"
        required: false
        default: "30"
      min_output_bytes:
        description: "Minimum output file size in bytes"
        required: false
        default: "32768"

permissions:
  contents: read

jobs:
  canary:
    runs-on: [self-hosted, linux, x64, radikeep]
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      RADIKO_STATION_ID: ${{ github.event.inputs.radiko_station_id || 'TBS' }}
      RADIRU_AREA_ID: ${{ github.event.inputs.radiru_area_id || 'JP13' }}
      RADIRU_STATION_ID: ${{ github.event.inputs.radiru_station_id || 'r1' }}
      REALTIME_RECORD_SECONDS: ${{ github.event.inputs.realtime_record_seconds || '30' }}
      TIMEFREE_RECORD_SECONDS: ${{ github.event.inputs.timefree_record_seconds || '30' }}
      RADIRU_ONDEMAND_RECORD_SECONDS: ${{ github.event.inputs.radiru_ondemand_record_seconds || '30' }}
      MIN_OUTPUT_BYTES: ${{ github.event.inputs.min_output_bytes || '32768' }}
      RADIKO_USER_ID: ${{ secrets.RADIKO_USER_ID }}
      RADIKO_PASSWORD: ${{ secrets.RADIKO_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Prepare output directories
        run: |
          mkdir -p results logs artifacts/recordings

      - name: Validate ffmpeg
        run: |
          set -euo pipefail
          ffmpeg -version

      - name: Run Canary Runner
        id: run_canary
        shell: bash
        run: |
          set +e
          dotnet run \
            --project src/Canary.Runner/Canary.Runner.csproj \
            --configuration Release \
            -- \
            --radiko-station-id "${RADIKO_STATION_ID}" \
            --radiru-area-id "${RADIRU_AREA_ID}" \
            --radiru-station-id "${RADIRU_STATION_ID}" \
            --realtime-record-seconds "${REALTIME_RECORD_SECONDS}" \
            --timefree-record-seconds "${TIMEFREE_RECORD_SECONDS}" \
            --radiru-ondemand-record-seconds "${RADIRU_ONDEMAND_RECORD_SECONDS}" \
            --min-output-bytes "${MIN_OUTPUT_BYTES}" \
            --status-json "results/status.json" \
            --log-dir "logs" \
            --record-output-dir "artifacts/recordings"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Ensure status.json exists
        if: always()
        shell: bash
        run: |
          if [ ! -f results/status.json ]; then
            cat << 'EOF' > results/status.json
          {
            "result": "FAIL",
            "message": "status.json was not generated by canary runner",
            "checks": []
          }
          EOF
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: |
            results/status.json
            logs/**
            artifacts/recordings/**
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Discord on failure or warning
        if: always() && steps.run_canary.outputs.exit_code != '0' && env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import pathlib
          import urllib.request

          status_path = pathlib.Path("results/status.json")
          if status_path.exists():
              summary = status_path.read_text(encoding="utf-8")
          else:
              summary = "status.json not found"

          content = (
              "[RadiKeep Canary] warning/failure detected\n"
              f"repo: {os.getenv('GITHUB_REPOSITORY', '')}\n"
              f"run: #{os.getenv('GITHUB_RUN_NUMBER', '')}\n"
              f"ref: {os.getenv('GITHUB_REF_NAME', '')}\n"
              f"url: https://github.com/{os.getenv('GITHUB_REPOSITORY', '')}/actions/runs/{os.getenv('GITHUB_RUN_ID', '')}\n"
              f"summary: {summary[:1500]}"
          )

          payload = json.dumps({"content": content}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              _ = resp.read()
          PY

      - name: Fail job when canary is not PASS
        if: steps.run_canary.outputs.exit_code != '0'
        run: exit 1
