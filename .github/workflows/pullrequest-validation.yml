name: Canary Runner Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify runner without external services
        run: dotnet test tests/Canary.Runner.Tests/Canary.Runner.Tests.csproj --configuration Release

      - name: Verify state storage without external services
        run: python3 -m unittest discover -s tests/state_storage -v
